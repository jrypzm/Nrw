name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Years-1.0.${{ github.run_number }}.apk"
          # fixed name, so the website can always link to .../releases/latest/download/yrs.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/yrs.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Years-apk
          path: out/*.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "years-1.0.${{ github.run_number }}" out/*.apk \
            --target "${{ github.sha }}" --latest \
            --title "yrs. 1.0.${{ github.run_number }}" \
            --notes "Android build of yrs. from ${{ github.ref_name }} (${{ github.sha }}). Download the APK below and open it on your phone to install."

  screens:
    # Real renders of every screen, attached to the same release. Never blocks the APK.
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Render screens
        working-directory: android
        run: gradle :app:recordPaparazziDebug -Pshots --no-daemon
      - name: Attach screens to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd android/app/src/test/snapshots/images
          zip -q -r "$GITHUB_WORKSPACE/screens-1.0.${{ github.run_number }}.zip" .
          gh release upload "years-1.0.${{ github.run_number }}" "$GITHUB_WORKSPACE/screens-1.0.${{ github.run_number }}.zip" --clobber
