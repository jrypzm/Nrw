name: yrs. slim (iOS debloat)

on:
  push:
    paths:
      - "ios-slim/**"
      - ".github/workflows/ios-slim.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the script
        run: |
          sh -n ios-slim/yrs-slim.sh
          shellcheck -s sh -S error ios-slim/yrs-slim.sh
      - name: Publish to the "ios-slim" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-slim >/dev/null 2>&1 || gh release create ios-slim --latest=false --title "yrs. slim: iOS 15 debloat" --notes "yrs. slim"
          gh release upload ios-slim ios-slim/yrs-slim.sh --clobber
          gh release edit ios-slim --notes "Debloat for jailbroken iPhones on iOS 15 (made for the iPhone 6s). Built from ${{ github.sha }}. On the phone: curl -fsSL https://github.com/${{ github.repository }}/releases/download/ios-slim/yrs-slim.sh -o yrs-slim.sh && bash yrs-slim.sh"
