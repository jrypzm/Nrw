name: Linux AppImage

on:
  push:
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # an older Ubuntu, so the AppImage runs on every current Fedora, Ubuntu and Arch
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Build the AppImage
        working-directory: linux
        run: ./build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: yrs-linux
          path: linux/dist/yrs-x86_64.AppImage
      - name: Publish to the "linux" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one release that always holds the newest AppImage, so the download link never changes,
          # and never marked "latest", so the Android download link keeps working
          gh release view linux >/dev/null 2>&1 || gh release create linux --latest=false --title "yrs. for Linux" \
            --notes "yrs. for Linux: one file, no install. Download yrs-x86_64.AppImage, make it executable (chmod +x, or Properties → Is executable), and open it."
          gh release upload linux linux/dist/yrs-x86_64.AppImage --clobber
          gh release edit linux --notes "yrs. for Linux, built from ${{ github.sha }}. Download yrs-x86_64.AppImage, make it executable (chmod +x, or Properties → Is executable), and open it. Runs on Fedora, Ubuntu, Arch and other current desktops, on Wayland and X11."
