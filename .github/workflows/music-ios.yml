name: yrs. music iPhone

on:
  push:
    paths:
      - "music-ios/**"
      - ".github/workflows/music-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version
      - name: Build the .ipa and a simulator app
        run: sh music-ios/build.sh --simulator
      - name: Run it on a simulated iPhone, take screenshots, measure it
        run: sh music-ios/screens.sh
      - name: Keep the screenshots with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yrs-music-ios
          path: |
            music-ios/build/yrs-music.ipa
            music-ios/build/*.png
            music-ios/build/usage.txt
      - name: Publish to the "music-ios" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view music-ios >/dev/null 2>&1 || gh release create music-ios --latest=false --title "yrs. music for iPhone" \
            --notes "yrs. music for iPhone."
          gh release upload music-ios music-ios/build/yrs-music.ipa music-ios/build/list.png music-ios/build/player.png music-ios/build/usage.txt --clobber
          gh release edit music-ios --notes "yrs. music for iPhone, iOS 15 and later (iPhone 6s too). Built from ${{ github.sha }}. Install the .ipa with Sideloadly, AltStore or TrollStore."
