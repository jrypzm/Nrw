name: A Ghostty icon for Linux Mint

on:
  push:
    paths:
      - "mint-ghostty/**"
      - ".github/workflows/mint-ghostty.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mint-ghostty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the installer
        working-directory: mint-ghostty
        run: |
          python3 make.py --pack
          sh -n install-yrs-ghostty.sh
          git diff --exit-code -- install-yrs-ghostty.sh || (echo "Run make.py and commit the result" && exit 1)
      - name: Publish to the "mint-ghostty" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mint-ghostty >/dev/null 2>&1 || gh release create mint-ghostty --latest=false --title "A Ghostty icon for Linux Mint" \
            --notes "A cyan ghost icon for the Ghostty terminal."
          gh release upload mint-ghostty mint-ghostty/install-yrs-ghostty.sh --clobber
          gh release edit mint-ghostty --notes "A cyan ghost icon for the Ghostty terminal, built from ${{ github.sha }}. Install: curl -fsSL https://github.com/${{ github.repository }}/releases/download/mint-ghostty/install-yrs-ghostty.sh | sh — undo: add -s -- --undo."
