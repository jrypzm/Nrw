name: yrs. home APK

on:
  push:
    paths:
      - "home/**"
      - ".github/workflows/home.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run tests and render every screen
        working-directory: home
        run: gradle testDebugUnitTest --no-daemon

      - name: Keep the rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yrs-home-screens
          path: home/app/build/screens/*.png
          if-no-files-found: ignore

      - name: Build signed APK
        working-directory: home
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp home/app/build/outputs/apk/release/app-release.apk out/yrs-home.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: yrs-home-apk
          path: out/*.apk

      - name: Publish to the "home" release
        # one fixed tag, never marked latest, so .../releases/latest/download/yrs.apk keeps pointing at yrs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete home --yes --cleanup-tag || true
          gh release create home out/yrs-home.apk \
            --target "${{ github.sha }}" --latest=false \
            --title "yrs. home (build ${{ github.run_number }})" \
            --notes "The yrs. home launcher, built from ${{ github.ref_name }} (${{ github.sha }}). Download yrs-home.apk and open it on your phone to install. Always at https://github.com/${{ github.repository }}/releases/download/home/yrs-home.apk"
