name: yrs. info iPhone

on:
  push:
    paths:
      - "info-ios/**"
      - ".github/workflows/info-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: info-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the .ipa and a simulator app
        run: sh info-ios/build.sh --simulator
      - name: Run it on a simulated iPhone, take screenshots, measure it
        run: sh info-ios/screens.sh
      - name: Keep the screenshots with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yrs-info-ios
          path: |
            info-ios/build/yrs-info.ipa
            info-ios/build/*.png
            info-ios/build/usage*.txt
      - name: Publish to the "info-ios" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view info-ios >/dev/null 2>&1 || gh release create info-ios --latest=false --title "yrs. info for iPhone" --notes "yrs. info for iPhone."
          gh release upload info-ios info-ios/build/yrs-info.ipa info-ios/build/info.png info-ios/build/usage.txt --clobber
          gh release edit info-ios --notes "yrs. info, your iPhone in plain numbers, iOS 15 and later (iPhone 6s too). Built from ${{ github.sha }}. Install the .ipa with Sideloadly, AltStore or TrollStore."
