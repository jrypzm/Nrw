name: yrs. music APK

on:
  push:
    paths:
      - "music/**"
      - ".github/workflows/music.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run tests and render every screen
        working-directory: music
        run: gradle testDebugUnitTest --no-daemon

      - name: Keep the rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yrs-music-screens
          path: music/app/build/screens/*.png
          if-no-files-found: ignore

      - name: Build signed APK
        working-directory: music
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp music/app/build/outputs/apk/release/yrs-music-release.apk out/yrs-music.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: yrs-music-apk
          path: out/*.apk

      - name: Publish to the "music" release
        # one fixed tag, never marked latest, so .../releases/latest/download/yrs.apk keeps pointing at yrs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete music --yes --cleanup-tag || true
          gh release create music out/yrs-music.apk \
            --target "${{ github.sha }}" --latest=false \
            --title "yrs. music (build ${{ github.run_number }})" \
            --notes "yrs. music, an offline player made from Lotus by dn0ne (GPL-3.0). Built from ${{ github.ref_name }} (${{ github.sha }}); source in the music/ folder. Download yrs-music.apk and open it on your phone to install. Always at https://github.com/${{ github.repository }}/releases/download/music/yrs-music.apk"
