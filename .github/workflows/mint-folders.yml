name: yrs. folders for Linux Mint

on:
  push:
    paths:
      - "mint-folders/**"
      - ".github/workflows/mint-folders.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mint-folders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the installer
        working-directory: mint-folders
        run: |
          python3 make.py
          sh -n install-yrs-folders.sh
          git diff --exit-code -- install-yrs-folders.sh || (echo "Run make.py and commit the result" && exit 1)
      - name: Publish to the "mint-folders" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mint-folders >/dev/null 2>&1 || gh release create mint-folders --latest=false --title "yrs. folders for Linux Mint" \
            --notes "Black glass folders for Nemo, with each folder's name on the front."
          gh release upload mint-folders mint-folders/install-yrs-folders.sh --clobber
          gh release edit mint-folders --notes "Black glass folders for Nemo, with each folder's name on the front, built from ${{ github.sha }}. Install: curl -fsSL https://github.com/${{ github.repository }}/releases/download/mint-folders/install-yrs-folders.sh | sh — undo: add -s -- --undo."
