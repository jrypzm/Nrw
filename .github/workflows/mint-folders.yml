name: yrs. folders for Linux Mint

on:
  push:
    paths:
      - "mint-folders/**"
      - ".github/workflows/mint-folders.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mint-folders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the installer and the pack belong together
        working-directory: mint-folders
        run: |
          sh -n install-yrs-folders.sh
          want=$(sed -n 's/^PACK_SHA=//p' install-yrs-folders.sh)
          got=$(sha256sum yrs-folders-designs.tar.gz | cut -d' ' -f1)
          [ "$want" = "$got" ] || (echo "Run make.py and commit the result" && exit 1)
          [ "$(tar -tzf yrs-folders-designs.tar.gz | wc -l)" = 100 ]
      - name: Publish to the "mint-folders" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mint-folders >/dev/null 2>&1 || gh release create mint-folders --latest=false --title "yrs. folders for Linux Mint" \
            --notes "A hundred material folders for Nemo."
          # the pack first, so a new installer never points at an old pack
          gh release upload mint-folders mint-folders/yrs-folders-designs.tar.gz --clobber
          gh release upload mint-folders mint-folders/install-yrs-folders.sh --clobber
          gh release edit mint-folders --notes "A hundred material folders for Nemo, a different one for every folder. Built from ${{ github.sha }}. Install: curl -fsSL https://github.com/${{ github.repository }}/releases/download/mint-folders/install-yrs-folders.sh | sh — undo: add -s -- --undo."
