name: Suggest an idea
description: Something that would make one of the apps better for you.
labels: [idea]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app
      options:
        - yrs.
        - yrs. home
        - yrs. music
        - A new yrs. app
        - The website
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: The idea
      placeholder: A widget that shows how many weekends are left this year.
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why it matters to you
      description: The moment or feeling behind it.
