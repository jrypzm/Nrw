name: Report a bug
description: Something looks wrong, counts wrong, or doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. A screenshot helps more than anything.
  - type: dropdown
    id: app
    attributes:
      label: Which app
      options:
        - yrs. for Android
        - yrs. for Linux
        - yrs. in the browser (or on iPhone)
        - yrs. home
        - yrs. music for Android
        - yrs. music for Linux
        - The website
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
      placeholder: In yrs. music, the lyrics stopped following the song after I scrolled.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Open the app
        2. ...
        3. ...
  - type: input
    id: device
    attributes:
      label: Device and version
      description: The app's build is in its Settings or in the release you downloaded. Leave out anything personal, like your birthday.
      placeholder: Galaxy S24 Ultra, Android 15, yrs. music build 3
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or a recording
      description: Drag images or videos here.
