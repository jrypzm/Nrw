[package]
name = "yrs-music"
version = "1.0.0"
edition = "2021"
description = "yrs. music: your music, offline."
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.31"
# rodio only plays; decoding is done in src/decode.rs with symphonia, which is handed the
# file itself (m4a and FLAC seeking need its size) and can decode Opus too
rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats"] }
symphonia-opus = "0.1"
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
resvg = { version = "0.45", default-features = false }
souvlaki = { version = "0.7", default-features = false, features = ["use_zbus"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# a panic in a helper thread (the desktop bus, a picker) must never stop the music
panic = "unwind"
