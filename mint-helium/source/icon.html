<!doctype html>
<html><head><meta charset="utf-8">
<style>*{margin:0;padding:0}body{background:transparent;width:1024px}svg{display:block;width:1024px;height:1024px}</style></head><body>
<script>
// ---------- geometry ----------
const C = 512;
const rot = (x, y, a) => { const r = a * Math.PI / 180; return [x * Math.cos(r) - y * Math.sin(r), x * Math.sin(r) + y * Math.cos(r)]; };
const P = (pts, a = 0, dx = 0, dy = 0) => 'M ' + pts.map(([x, y]) => { const [u, v] = rot(x, y, a); return `${(C + u + dx).toFixed(2)} ${(C + v + dy).toFixed(2)}`; }).join(' L ') + ' Z';
// Helium's arm, pointing up, on a 1024 grid (the official star scaled by 3.2):
// narrow where it meets the centre, wider outward, ending in an arrow tip.
const arm = ({ r0 = 54, w0 = 31, r1 = 255, w1 = 58, r2 = 298 } = {}) => [[-w0, -r0], [-w1, -r1], [0, -r2], [w1, -r1], [w0, -r0]];
const ANG = [0, 60, 120, 180, 240, 300];

// a true squircle (superellipse, n = 5), not a rounded rectangle
const squircle = (cx = 512, cy = 512, R = 440, n = 5) => {
  let d = ''; for (let i = 0; i <= 240; i++) { const t = i / 240 * 2 * Math.PI, c = Math.cos(t), s = Math.sin(t);
    const x = cx + R * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), y = cy + R * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    d += (i ? ' L ' : 'M ') + x.toFixed(2) + ' ' + y.toFixed(2); } return d + ' Z'; };
const SQ = squircle();

// the tile: flat colour, light gathered along the inner edge, a whisper of top light
const tile = ({ base, edge, edgeOp = .9, top = .1, glow = 70, deep }) => `
  <defs>
    <clipPath id="tc"><path d="${SQ}"/></clipPath>
    <filter id="eg" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${glow}"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="20"/></filter>
    <linearGradient id="tl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${top}"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="${squircle(512, 548, 420)}" fill="#000" opacity=".45" filter="url(#sh)"/>
  <g clip-path="url(#tc)">
    <path d="${SQ}" fill="${base}"/>
    ${deep ? `<circle cx="512" cy="512" r="330" fill="${deep}" filter="url(#eg)"/>` : ''}
    <path d="${SQ}" fill="none" stroke="${edge}" stroke-width="${glow * 1.2}" stroke-opacity="${edgeOp}" filter="url(#eg)"/>
    <path d="${SQ}" fill="url(#tl)"/>
  </g>`;

// ---------- the marks ----------
const MARKS = {
  // 1. Night: six arms set free, a gap around a small centre stone. White on deep navy with a blue rim.
  night: () => {
    const a = arm({ r0: 0, w0: 30, r1: 252, w1: 56, r2: 296 });
    const arms = ANG.map((g) => `<path d="${P(a, g)}"/>`).join('');
    return tile({ base: '#070c2c', edge: '#3557f0', edgeOp: .75, glow: 46, top: .04 }) + `
      <filter id="mg" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
      <mask id="win"><rect width="1024" height="1024" fill="#fff"/><path d="${P([[0, -46], [40, -23], [40, 23], [0, 46], [-40, 23], [-40, -23]], 30)}" fill="#000"/></mask>
      <g fill="#5d7bff" opacity=".5" filter="url(#mg)">${arms}</g>
      <g fill="#fff" mask="url(#win)">${arms}</g>`;
  },
  // 2. Weave: the three bars of the star pass over and under each other like a knot
  weave: () => {
    // Outline: the whole star drawn as one bold line, corners softened
    const RAW = "M145.966 207.813L128 221L110.034 207.813L118.198 144.891L67.4689 183.379L47 174.5L49.4993 152.438L108.391 128L49.4993 103.562L47 81.5L67.4689 72.6214L118.198 111.109L110.034 48.1871L128 35L145.966 48.1871L137.802 111.109L188.531 72.6214L209 81.5L206.501 103.562L147.609 128L206.501 152.438L209 174.5L188.531 183.379L137.802 144.891L145.966 207.813Z";
    const S = RAW.replace(/(\d+\.?\d*) (\d+\.?\d*)/g, (_, x, y) => `${(3.25 * (x - 128) + 512).toFixed(2)} ${(3.25 * (y - 128) + 512).toFixed(2)}`);
    return tile({ base: '#3450D1', edge: '#7a95ff', edgeOp: .6, glow: 50, top: .1 }) +
      `<path d="${S}" fill="none" stroke="#fff" stroke-width="34" stroke-linejoin="round"/>`;
  },
  // 3. Seal: a white tile, a Helium-blue disc with the star cut out of it
  seal: () => {
    const a = arm({ r0: 0, w0: 22, r1: 186, w1: 41, r2: 218 });
    return tile({ base: '#ffffff', edge: '#d9def0', edgeOp: 1, glow: 50, top: 0 }) + `
      <mask id="cut"><rect width="1024" height="1024" fill="#fff"/>${ANG.map((g) => `<path d="${P(a, g)}" fill="#000"/>`).join('')}</mask>
      <circle cx="512" cy="512" r="318" fill="#3450D1" mask="url(#cut)"/>
      <circle cx="512" cy="512" r="318" fill="none" stroke="#000" stroke-opacity=".06" stroke-width="2"/>`;
  },
  // 4. Facet: flat, two-tone; each arm lit on one side, so it reads cut from one piece
  facet: () => {
    const a = arm({ r0: 0, w0: 30, r1: 252, w1: 56, r2: 296 });
    const halfL = [[-30, 0], [-56, -252], [0, -296], [0, 0]];
    let s = ''; for (const g of ANG) s += `<path d="${P(a, g)}" fill="#c9d3ff"/><path d="${P(halfL, g)}" fill="#fff"/>`;
    return tile({ base: '#2f49c8', edge: '#6e8bff', edgeOp: .6, glow: 50, top: .1 }) + s;
  },
  // 5. Volt: acid lime, a black star; every arm notched at its root so the centre opens into a small star of light
  volt: () => {
    const a = [[-26, -58], [-56, -252], [0, -296], [56, -252], [26, -58], [0, -30]];
    return tile({ base: '#d4ff1f', edge: '#f6ffc4', edgeOp: .7, glow: 46, top: .15 }) + `<g fill="#0b0b0b">${ANG.map((g) => `<path d="${P(a, g)}"/>`).join('')}</g>`;
  },
  // 6. Burst: black glass, the star with six short rays between its arms; light from the core
  burst: () => {
    const a = arm({ r0: 0, w0: 28, r1: 250, w1: 52, r2: 292 });
    const spark = (r, k) => [[0, -r - k], [k * .28, -r], [0, -r + k], [-k * .28, -r]];
    return tile({ base: '#07070a', edge: '#3a3d4e', edgeOp: .8, glow: 44, top: .06, deep: '#141c48' }) + `
      <linearGradient id="mk" x1="0" y1="200" x2="0" y2="824" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b4c1ff"/></linearGradient>
      <filter id="mg" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
      <circle cx="512" cy="512" r="170" fill="#3450D1" opacity=".6" filter="url(#mg)"/>
      <g fill="url(#mk)">${ANG.map((g) => `<path d="${P(a, g)}"/>`).join('')}</g>
      <g fill="#cfd8ff">${ANG.map((g, i) => `<path d="${P(spark(i % 2 ? 196 : 232, i % 2 ? 22 : 30), g + 30)}"/>`).join('')}</g>`;
  },
};
const id = new URLSearchParams(location.search).get('i');
document.body.innerHTML = `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${MARKS[id]()}</svg>`;
</script></body></html>
