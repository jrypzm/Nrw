<style>
  /* yrs. on the web: one screen, true black, the system font, native scrolling everywhere. */
  :root {

  /* ---------- date wheels: native momentum, snapping to each row ---------- */

  .wheel { position: relative; height: 220px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%, #000 65%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 35%, #000 65%, transparent); overscroll-behavior: contain; }

  /* ---------- onboarding ---------- */
  #ob { display: flex; flex-direction: column; padding: calc(var(--st) + 8px) calc(24px + var(--sr)) 0 calc(24px + var(--sl)); }

  .mark .p::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--f, 62%); background: var(--fg); transition: height 1.6s var(--ease); }

  /* ---------- home ---------- */

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// phones fire mouse events after a touch; desktop mouse handlers ignore those
let lastTouch = 0;
document.addEventListener('touchstart', () => { lastTouch = Date.now(); }, { passive: true, capture: true });
const fromTouch = () => Date.now() - lastTouch < 900;
const DPR = () => Math.min(3, devicePixelRatio || 1);
const fmt = n => Math.floor(Math.max(0, n)).toLocaleString('en-US');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// ================================================= haptics
// iOS 18+ Safari gives a light haptic when a switch control toggles; other phones use vibrate.
const hapt = $('hapt');
function tick() { try { if (navigator.vibrate) navigator.vibrate(6); else hapt.click(); } catch {} }
function thump() { try { if (navigator.vibrate) navigator.vibrate(14); else { hapt.click(); setTimeout(() => hapt.click(), 70); } } catch {} }

// ================================================= storage
const KEY = 'yrs.v2', LKEY = 'yrs.lines';
const DEF = { birth: null, span: 80, lived: false, pct: false, style: 'classic', sun: false, ripple: true, names: {}, wall: 'daylight', unit: 0, page: 0, zoom: 1, people: [], events: [], letters: [], reviewedAge: -1, habits: [], phoneH: 3, tourDone: false };
const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
let S = Object.assign({}, DEF, read(KEY, {}));
// carry over a birthday from the first web version
if (!S.birth) { const old = read('years.v1', null); if (old && old.birth) { S.birth = old.birth; S.span = old.span || 80; S.names = old.names || {}; } }
let LINES = read(LKEY, {});
// ?demo=YYYY-MM-DD runs a throwaway copy (used by the live phone on the website); nothing is saved
const Q = new URLSearchParams(location.search), DEMO = /^\d{4}-\d{2}-\d{2}$/.test(Q.get('demo') || '') ? Q.get('demo') : null;
if (DEMO) {
  const by = +DEMO.slice(0, 4), t = new Date(), ev = new Date(t.getFullYear(), t.getMonth() + 4, 12);
  S = Object.assign({}, DEF, { birth: DEMO, span: Math.min(120, Math.max(40, +Q.get('span') || 80)), ripple: true,
    names: { [Math.max(0, t.getFullYear() - by - 7)]: 'Moved to Lisbon', [Math.max(0, t.getFullYear() - by + 6)]: 'See the northern lights' },
    people: [{ name: 'Mum', born: by - 29, per: 4 }, { name: 'Sam', born: by + 1, per: 52 }],
    events: [{ name: 'Trip to Japan', date: `${ev.getFullYear()}-${String(ev.getMonth() + 1).padStart(2, '0')}-12` }] });
  LINES = { [`${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`]: 'Coffee on the balcony before anyone woke up.' };
}
const save = () => { if (DEMO) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const saveLines = () => { if (DEMO) return; try { localStorage.setItem(LKEY, JSON.stringify(LINES)); } catch {} };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

// ================================================= life maths (same rules as the Android app)
const birthdayIn = (b, y) => { const d = new Date(y, b.getMonth(), b.getDate()); return d.getMonth() !== b.getMonth() ? new Date(y, b.getMonth() + 1, 0) : d; };
const wholeYears = (b, t) => { let y = t.getFullYear() - b.getFullYear(); if (birthdayIn(b, t.getFullYear()) > day0(t)) y--; return Math.max(0, y); };
function age(b, now = new Date()) {
  if (day0(now) <= b) return 0;
  const y = wholeYears(b, now), last = birthdayIn(b, b.getFullYear() + y), next = birthdayIn(b, b.getFullYear() + y + 1);
  return y + Math.min(.999999, Math.max(0, (now - last) / (next - last)));
}
const lastBirthday = (b, t) => birthdayIn(b, b.getFullYear() + wholeYears(b, t));
const isBirthday = (b, t = new Date()) => day0(t) > b && +birthdayIn(b, t.getFullYear()) === +day0(t);
const addMonths = (d, k) => { const x = new Date(d.getFullYear(), d.getMonth() + k, 1); x.setDate(Math.min(d.getDate(), new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; };
const birth = () => parse(S.birth);
const yearsLeft = () => Math.max(0, S.span - age(birth()));
const daysLeftExact = () => Math.max(0, (new Date(birth().getFullYear() + S.span, birth().getMonth(), birth().getDate()) - new Date()) / 864e5);
const daysLived = () => Math.max(0, (new Date() - birth()) / 864e5);
const dayOfLife = (t = new Date()) => Math.floor((day0(t) - birth()) / 864e5) + 1;

const MEASURES = [['year', 'years', 1], ['day', 'days', 365.2425], ['week', 'weeks', 52.1775], ['summer', 'summers', 1], ['weekend', 'weekends', 52.1775], ['full moon', 'full moons', 365.2425 / 29.530589]];
const ZOOMS = ['History', 'Years', 'Months', 'Weeks', 'Days'];
const LIFETIMES = 3750;

function model(kind, now = new Date()) {
  const b = birth(), a = age(b, now), lived = Math.floor(a), by = b.getFullYear();
  if (kind === 'decade') {
    const st = Math.floor(lived / 10) * 10;
    return { kind, total: 10, done: Math.min(10, Math.max(0, a - st)), cols: 5, unit: 'year', context: st === 0 ? 'Your first decade' : `Your ${st}s`, sub: `Ages ${st}–${st + 9}`, label: i => `Age ${st + i} · ${by + st + i}`, year: i => st + i };
  }
  if (kind === 'year') {
    const lb = lastBirthday(b, now); let m = 0;
    while (m < 11 && addMonths(lb, m + 1) <= day0(now)) m++;
    const st = addMonths(lb, m), en = m === 11 ? birthdayIn(b, lb.getFullYear() + 1) : addMonths(lb, m + 1);
    const f = Math.min(1, Math.max(0, (now - st) / (en - st)));
    const nb = birthdayIn(b, lb.getFullYear() + 1);
    return { kind, total: 12, done: Math.min(12, m + f), cols: 6, unit: 'month', context: `Age ${lived}`, sub: `Turning ${lived + 1} on ${nb.getDate()} ${MON[nb.getMonth()]}`, label: i => { const d = addMonths(lb, i); return `${MON[d.getMonth()]} ${d.getFullYear()}`; }, year: null };
  }
  const sub = `Age ${lived} · ${S.span} year life`;
  switch (S.zoom) {
    case 0: return { kind, total: LIFETIMES, done: LIFETIMES - 1 + Math.min(1, a / S.span), cols: 50, unit: 'lifetime', sub: 'Yours is the last one, filling now', label: i => i === LIFETIMES - 1 ? 'Your life' : `About ${fmt((LIFETIMES - 1 - i) * 80)} years ago`, year: null };

function wheel(items, index, width, onChange) {

  w.innerHTML = '<div class="pad"></div>' + items.map(t => `<div class="it">${t}</div>`).join('') + '<div class="pad"></div>';

  requestAnimationFrame(() => w.set(index, false));

}
/** Day · Month · Year wheels. */
function dateWheels(value, onChange, { from = 1920, to = new Date().getFullYear(), latest = day0(new Date()), earliest = null } = {}) {
  const box = document.createElement('div'); box.className = 'wheels';
  let v = new Date(value), dW, mW, yW;
  const years = []; for (let y = from; y <= to; y++) years.push(y);
  const days = () => { const n = new Date(v.getFullYear(), v.getMonth() + 1, 0).getDate(); return Array.from({ length: n }, (_, i) => i + 1); };
  const commit = (y, m, d) => {
    const max = new Date(y, m + 1, 0).getDate(); let nv = new Date(y, m, Math.min(d, max));
    if (latest && nv > latest) nv = new Date(latest); if (earliest && nv < earliest) nv = new Date(earliest);
    const daysChanged = new Date(nv.getFullYear(), nv.getMonth() + 1, 0).getDate() !== new Date(v.getFullYear(), v.getMonth() + 1, 0).getDate();
    const clamped = nv.getFullYear() !== y || nv.getMonth() !== m || nv.getDate() !== d;
    v = nv;
    if (daysChanged) { const nd = wheel(days(), v.getDate() - 1, 56, i => commit(v.getFullYear(), v.getMonth(), i + 1)); dW.replaceWith(nd); dW = nd; }
    if (clamped) { dW.set(v.getDate() - 1, true); mW.set(v.getMonth(), true); yW.set(years.indexOf(v.getFullYear()), true); }
    onChange(new Date(v));
  };

  mW = wheel(MONTHS, v.getMonth(), 150, i => commit(v.getFullYear(), i, v.getDate()));
  yW = wheel(years, Math.max(0, years.indexOf(v.getFullYear())), 84, i => commit(years[i], v.getMonth(), v.getDate()));

}

  requestAnimationFrame(() => $('extra-people').querySelectorAll('canvas[data-visits]').forEach(cv => {
    const n = +cv.dataset.visits, W = cv.clientWidth, cell = W / 20, H = Math.ceil(n / 20) * cell, x = sizeCanvas(cv, W, H);
    for (let i = 0; i < n; i++) circle(x, (i % 20 + .5) * cell, (Math.floor(i / 20) + .5) * cell, cell * .28, '#fff');
  }));

  // ledger
  const left = yearsLeft(), a = age(birth()), sleep = left / 3, work = Math.max(0, Math.min(left, 65 - a)) * 1920 / 8766, upkeep = left / 8;
  const phone = Math.min(left * S.phoneH / 24, Math.max(0, left - sleep - work - upkeep)), free = Math.max(0, left - sleep - work - phone - upkeep);
  const sl = [['Asleep', sleep, '#2c2c2e'], ['Working', work, '#48484a'], ['On your phone', phone, '#8e8e93'], ['Eating, chores, commuting', upkeep, '#3a3a3c'], ['Truly yours', free, '#ffffff']];
  $('head-ledger').innerHTML = `<div class="h-title">Your ${fmt(left)} years</div><div class="h-sub">Where the time you have left will go</div>`;
  $('extra-ledger').innerHTML = `<canvas id="ledgerGrid" style="display:block;width:100%;margin-top:28px"></canvas><div class="legend" style="margin-top:22px">${sl.map((s, i) => `<div class="lr ${i === 4 ? 'y' : ''}"><i style="background:${s[2]}"></i>${s[0]}<b>${s[1].toFixed(1)} yrs</b></div>`).join('')}</div>
    <div class="card" style="margin-top:20px"><div class="k">Your phone time</div><div class="small" style="margin-top:4px">Your phone's screen time settings show your daily average. Set it here.</div>
    <input class="range" id="phoneR" type="range" min="0" max="12" step="0.25" value="${S.phoneH}"><div class="small" id="phoneV">${S.phoneH} hours a day</div></div>
    <p class="small" style="margin-top:12px;color:var(--faint)">Sleep 8 h a day, work 40 h a week until 65, 3 h a day eating, chores and getting around.</p>`;
  const total = Math.max(1, Math.round(left)), raw = sl.map(s => s[1] / Math.max(.01, left) * total), ints = raw.map(Math.floor);
  let rest = total - ints.reduce((p, c) => p + c, 0); raw.map((v, i) => [v - Math.floor(v), i]).sort((p, q) => q[0] - p[0]).forEach(([, i]) => { if (rest > 0) { ints[i]++; rest--; } });
  const colors = ints.flatMap((n, i) => Array(n).fill(sl[i][2]));
  requestAnimationFrame(() => { const cv = $('ledgerGrid'); if (!cv) return; const W = cv.clientWidth, cell = W / 9.6, H = Math.ceil(colors.length / 10) * cell - cell * .4, x = sizeCanvas(cv, W, H);
    colors.forEach((c, i) => circle(x, -cell * .2 + (i % 10 + .5) * cell, -cell * .2 + (Math.floor(i / 10) + .5) * cell, cell * .3, c)); });
  const r = $('phoneR'); let rT;
  r.oninput = () => { S.phoneH = +r.value; $('phoneV').textContent = `${S.phoneH} hours a day`; if (Math.round(S.phoneH * 4) % 4 === 0) tick(); clearTimeout(rT); rT = setTimeout(() => { save(); const y = $('pager').querySelector('[data-i="4"]').scrollTop; renderExtras(); $('pager').querySelector('[data-i="4"]').scrollTop = y; }, 250); };
}

// ================================================= moments
function checkMoments() {
  if (DEMO || $('layer').classList.contains('open') || !S.birth) return;
  const b = birth(), lived = Math.floor(age(b));
  const li = S.letters.findIndex(l => !l.opened && l.age <= lived);
  if (li >= 0) { openSheet('letter', li); return; }
  const days = (day0(new Date()) - lastBirthday(b, new Date())) / 864e5;
  if (S.reviewedAge >= 0 && S.reviewedAge < lived && days <= 30) openSheet('review');
}

(() => { let y0 = null, dy = 0;
  const startDrag = e => { if (e.target.closest('.grab') || body.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } };
  sheet.addEventListener('touchstart', startDrag, { passive: true });

  el.innerHTML = `<div class="thumb" style="width:calc((100% - 4px)/${options.length})"></div>` + options.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join('');

/** On a computer the card sits beside its spotlight: right of the sidebar, right of the content, or in a corner. */
function placeDesk(card, r, W, H) {
  const cw = 380, ch = card.offsetHeight, m = 24, clampY = y => Math.max(m, Math.min(H - ch - m, y));
  let x, y;
  if (!r) { x = (W - cw) / 2 + 128; y = (H - ch) / 2; }
  else if (r.right < 280) { x = 280; y = clampY(r.top + r.height / 2 - ch / 2); }
  else if (r.right + 32 + cw < W - m) { x = r.right + 32; y = clampY(r.top - 10); }
  else if (r.bottom + 16 + ch < H - m) { x = Math.min(W - cw - m, Math.max(m, r.left)); y = r.bottom + 16; }
  else if (r.top - 16 - ch > m && r.height < H * .5) { x = Math.min(W - cw - m, Math.max(m, r.right - cw)); y = r.top - 16 - ch; }
  else { x = W - cw - m; y = H - ch - m; }
  card.style.left = x + 'px'; card.style.top = y + 'px';
}
function tourFrame() {
  if (tourAt < 0) return;

  const sheetOpen = layer.classList.contains('open');

  if (r && (r.width === 0 || r.right < 0 || r.left > W)) r = null;
  const pad = 10;
  if (r) {
    const x = r.left - pad, y = r.top - pad, w = r.width + 2 * pad, h = r.height + 2 * pad;
    Object.assign(hole.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', borderRadius: Math.min(h / 2, 22) + 'px' });
    hole.classList.remove('none');
    const ch = card.offsetHeight, below = y + h + 16;
    if (DESK) placeDesk(card, r, W, H); else card.style.left = '',
    // below the spotlight, else above it; a spotlight too tall for either (the grid) keeps its top free and the card docks low
    card.style.top = (below + ch < H - 24 ? below : y - 16 - ch >= 24 ? y - 16 - ch : H - ch - 24 - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sbm')) || 0)) + 'px';
    // the ghost fingertip, hidden once you've got it

    const cx = hr.left + hr.width / 2, cy = kind === 'swipe' ? r.top - 150 : hr.top + hr.height / 2;
    [$('tF1'), $('tF2')].forEach((f, k) => { f.className = 'finger' + (kind && (k === 0 || kind === 'pinch') ? ' ' + (k === 1 ? 'pinch2' : kind) : ''); f.style.left = cx + 'px'; f.style.top = cy + 'px'; });
  } else {
    Object.assign(hole.style, { left: W / 2 + 'px', top: H * .42 + 'px', width: '0px', height: '0px' });
    hole.classList.add('none');
    if (DESK) placeDesk(card, null, W, H); else { card.style.left = ''; card.style.top = Math.max(24, (H - card.offsetHeight) / 2) + 'px'; }

  }

}

  requestAnimationFrame(() => { renderAll(false); $('pager').scrollTo({ left: S.page * $('pager').clientWidth, behavior: 'instant' }); });
}
deskMQ.addEventListener ? deskMQ.addEventListener('change', applyDesk) : deskMQ.addListener(applyDesk);
applyDesk();
$('moreBtn').insertAdjacentHTML('beforeend', '<kbd class="dk">S</kbd>');
function goPage(i) { i = Math.max(0, Math.min(PAGES.length - 1, i)); if (i === S.page) return; tick(); $('pager').scrollTo({ left: i * $('pager').clientWidth, behavior: 'smooth' }); }
$('keysBtn').onclick = () => { tick(); openSheet('keys'); };

const KEYS = [
  [['←', '→'], 'Previous or next page'], [['1', '–', '5'], 'Go to a page'],
  [['+', '−'], 'Zoom in or out of your life'], [[MOD, 'scroll'], 'Zoom with the mouse or trackpad'],
  [['U'], 'Count another way: days, weeks, summers…'], [['Space'], 'Hold to feel the seconds'],
  [['L'], 'Left or lived'], [['P'], 'Percentage'],
  [['S'], 'Settings'], [['G'], 'Guide'], [['?'], 'These shortcuts'], [['Esc'], 'Close'],
];
SHEETS.keys = () => {
  body.innerHTML = H2('Keyboard shortcuts', 'Hover over the dots to travel through time. Click one to keep its label.') +
    `<div class="keylist">${KEYS.map(([ks, t]) => `<div class="k">${ks.map(k => k === '–' ? '<span>–</span>' : `<kbd>${k}</kbd>`).join('')}</div><span>${t}</span>`).join('')}</div>
    <div style="height:26px"></div><button class="primary" id="kDone">Done</button>`;
  $('kDone').onclick = () => { tick(); closeSheet(); };
};

let spaceDown = false;
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '') || document.activeElement?.isContentEditable;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // onboarding
  if (!$('ob').hidden) {
    if (e.key === 'Enter' && !typing) { e.preventDefault(); $('obGo').click(); }
    else if (e.key === 'Escape' && !$('obBack').hidden) $('obBack').click();
    return;
  }
  if (!started || $('home').hidden) return;
  if (layer.classList.contains('open')) { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } return; }
  if (typing) return;
  if (tourAt >= 0) {
    if (e.key === 'Escape') { e.preventDefault(); tourGo(-1); return; }
    if (e.key === 'Enter') { e.preventDefault(); $('tNext').click(); return; }
  }
  const k = e.key;
  if (k === 'ArrowRight' || k === ']') { e.preventDefault(); goPage(S.page + 1); }
  else if (k === 'ArrowLeft' || k === '[') { e.preventDefault(); goPage(S.page - 1); }
  else if (/^[1-5]$/.test(k)) goPage(+k - 1);
  else if ((k === '+' || k === '=') && S.page === 0) { if (S.zoom < 4) setZoom(S.zoom + 1); }
  else if ((k === '-' || k === '_') && S.page === 0) { if (S.zoom > 0) setZoom(S.zoom - 1); }
  else if (k === 'l' || k === 'L') { if (S.page < 3) $('modeBtn').click(); }
  else if (k === 'p' || k === 'P' || k === '%') { if (S.page < 3) $('pctBtn').click(); }
  else if (k === 'u' || k === 'U') { if (S.page === 0) $('head-life').click(); }
  else if (k === 's' || k === 'S' || k === ',') { tick(); openSheet('settings'); }
  else if (k === 'g' || k === 'G') { tick(); openSheet('guide'); }
  else if (k === '?' || k === '/') { tick(); openSheet('keys'); }
  else if (k === ' ' && S.page < 3) {
    e.preventDefault();
    if (!e.repeat && !spaceDown) { spaceDown = true; beat(PAGES[S.page], true); thump(); clearInterval(spaceBeat); spaceBeat = setInterval(() => thump(), 1000); }
  }
});
let spaceBeat = 0;
document.addEventListener('keyup', e => { if (e.key === ' ' && spaceDown) { spaceDown = false; clearInterval(spaceBeat); beat(PAGES[S.page], false); } });
addEventListener('blur', () => { if (spaceDown) { spaceDown = false; clearInterval(spaceBeat); beat(PAGES[S.page], false); } });

// ================================================= lifecycle
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(liveRAF); return; }
  if (S.birth && started) { renderAll(false); setTimeout(rippleNow, 350); setTimeout(checkMoments, 600); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (started) { renderAll(false); $('pager').scrollTo({ left: S.page * $('pager').clientWidth, behavior: 'instant' }); } }, 150); });
setInterval(() => { if (S.birth && started && !document.hidden) { ['life', 'decade', 'year'].forEach(k => { grids[k].update(false); if (S.style !== 'live') renderHead(k); }); } }, 30000);

if (DEMO) addEventListener('message', e => {
  const d = e.data || {}; if (!started || typeof d !== 'object') return;
  if (d.close) closeSheet();
  if (typeof d.zoom === 'number' && d.zoom >= 0 && d.zoom <= 4) setZoom(d.zoom);
  if (typeof d.page === 'number') $('pager').scrollTo({ left: Math.max(0, Math.min(4, d.page)) * $('pager').clientWidth, behavior: 'smooth' });
  if (d.style && ['classic', 'hero', 'live'].includes(d.style)) { S.style = d.style; swapHead(); }
  if (typeof d.lived === 'boolean' && d.lived !== S.lived) { S.lived = d.lived; swapHead(); }
  if (d.sheet === 'milestone') openSheet('milestone', Math.floor(age(birth())) + 6);
  if (d.sheet === 'settings') openSheet('settings');
  if (d.ripple) { S.zoom === 1 ? rippleNow() : 0; }
});
if (S.birth) startHome(); else { $('ob').hidden = false; obRender(1); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
