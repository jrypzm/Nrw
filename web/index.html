<style>
  /* yrs. on the web: one screen, true black, the system font, native scrolling everywhere. */
  :root {
    --bg: #000; --fg: #fff; --mute: #8e8e93; --faint: #48484a; --empty: #232323; --partial: #3a3a3c;

  /* ---------- shared controls ---------- */
  .round { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; transition: background .2s, transform .35s var(--spring); }

  /* ---------- date wheels: native momentum, snapping to each row ---------- */
  .wheels { position: relative; display: flex; justify-content: center; gap: 4px; height: 220px; }

  .sheet .wheels::before { background: var(--surface3); }
  .wheel { position: relative; height: 220px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%, #000 65%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 35%, #000 65%, transparent); overscroll-behavior: contain; }

  /* ---------- onboarding ---------- */
  #ob { display: flex; flex-direction: column; padding: calc(var(--st) + 8px) calc(24px + var(--sr)) 0 calc(24px + var(--sl)); }

  .mark .p { position: relative; display: inline-block; width: .24em; height: .24em; margin-left: .03em; margin-bottom: .12em; border-radius: 50%; background: var(--partial); overflow: hidden; }
  .mark .p::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--f, 62%); background: var(--fg); transition: height 1.6s var(--ease); }
  .bignum { font-family: var(--display); font-weight: 200; font-size: 96px; line-height: 1; letter-spacing: -0.05em; }
  .chips { display: flex; gap: 8px; margin-top: 14px; }

  .chips button.sel { background: var(--fg); color: #000; }
  .plusminus { display: flex; gap: 10px; } .plusminus button { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); font-size: 22px; }
  .plusminus button:active { background: var(--surface2); }

  /* ---------- home ---------- */
  #home .top { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: calc(var(--st) + 8px) calc(24px + var(--sr)) 0 calc(24px + var(--sl)); height: calc(var(--st) + 52px); }
  #home .brand { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.05em; color: var(--fg); }
  .pager { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .pager::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; padding: calc(var(--st) + 82px) calc(24px + var(--sr)) calc(var(--sbm) + 110px) calc(24px + var(--sl)); scrollbar-width: none; }
  .page::-webkit-scrollbar { display: none; }
  .controls { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 22px calc(24px + var(--sr)) calc(var(--sbm) + 14px) calc(24px + var(--sl)); background: linear-gradient(to top, #000 55%, rgba(0,0,0,0)); pointer-events: none; }

  .pdots { display: flex; } .pdots button { width: 18px; height: 36px; display: grid; place-items: center; }

  @keyframes pulse { 0% { transform: scale(1); } 12% { transform: scale(1.025); } 30% { transform: scale(1); } }

  .legend .lr i { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; } .legend .lr b { margin-left: auto; color: var(--fg); font-weight: 400; }
  .legend .lr.y { color: var(--fg); } .legend .lr.y b { font-weight: 600; }
  .range { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: var(--surface3); outline: none; margin: 14px 0 6px; }

  /* ---------- sheets ---------- */
  .layer { position: fixed; inset: 0; z-index: 20; pointer-events: none; }

  /* ---------- the tour: a spotlight that never blocks your fingers ---------- */

<script>

function ledgerColors(d) {

}

function dots(cv, n, cols, colorAt, ratio = .6) {

}

let spaceDown = false;
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '') || document.activeElement?.isContentEditable;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$('pal').hidden) return;
  // onboarding
  if (!$('ob').hidden) {
    if (e.key === 'Enter' && !typing) { e.preventDefault(); $('obGo').click(); }
    else if (e.key === 'Escape' && !$('obBack').hidden) $('obBack').click();
    return;
  }
  if (!started || ($('home').hidden && !(DESK && studioOn))) return;
  if (layer.classList.contains('open')) { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } return; }
  if (typing) return;
  if (tourAt >= 0) {
    if (e.key === 'Escape') { e.preventDefault(); tourGo(-1); return; }
    if (e.key === 'Enter') { e.preventDefault(); $('tNext').click(); return; }
  }
  const k = e.key;
  if (k === 'ArrowRight' || k === ']') { e.preventDefault(); DESK && studioOn ? studioGo(S.dpage + 1) : goPage(S.page + 1); }
  else if (k === 'ArrowLeft' || k === '[') { e.preventDefault(); DESK && studioOn ? studioGo(S.dpage - 1) : goPage(S.page - 1); }
  else if (/^[1-5]$/.test(k)) goPage(+k - 1);
  else if ((k === '+' || k === '=') && (DESK ? S.dpage === 1 : S.page === 0)) { if (S.zoom < 4) setZoom(S.zoom + 1); }
  else if ((k === '-' || k === '_') && (DESK ? S.dpage === 1 : S.page === 0)) { if (S.zoom > 0) setZoom(S.zoom - 1); }
  else if (k === 'l' || k === 'L') { if (S.page < 3) $('modeBtn').click(); }
  else if (k === 'p' || k === 'P' || k === '%') { if (S.page < 3) $('pctBtn').click(); }
  else if (k === 'u' || k === 'U') { if (DESK && studioOn) { if (S.dpage === 1) $('st-num')?.click(); } else if (S.page === 0) $('head-life').click(); }
  else if (k === 's' || k === 'S' || k === ',') { tick(); openSheet('settings'); }
  else if (k === 'g' || k === 'G') { tick(); openSheet('guide'); }
  else if (k === '?' || k === '/') { tick(); openSheet('keys'); }
  else if (k === ' ' && (DESK && studioOn ? SKIND[S.dpage] : S.page < 3)) {
    e.preventDefault();
    if (!e.repeat && !spaceDown) { spaceDown = true; DESK && studioOn ? studioBeat(true) : beat(PAGES[S.page], true); thump(); clearInterval(spaceBeat); spaceBeat = setInterval(() => thump(), 1000); }
  }
});
let spaceBeat = 0;
document.addEventListener('keyup', e => { if (e.key === ' ' && spaceDown) { spaceDown = false; clearInterval(spaceBeat); DESK && studioOn ? studioBeat(false) : beat(PAGES[S.page], false); } });

// A Gompertz–Makeham mortality curve: a small constant risk plus a risk that doubles about every 7.7 years of age.
// It is calibrated so that a typical person of your sex in your country matches the UN life expectancy, then each
// answer scales the yearly risk of death by a published hazard ratio. Ratios are re-centred on how common each
// answer is (so a typical answer changes nothing), and because habits cluster in the same people, the biggest
// effect counts fully and each further one counts less — calibrated so all five healthy habits add ~13 years at
// 50, as Li et al. (Circulation 2018) found (12.2 for men, 14.0 for women).

      dots(cv, n, 10, i => i < Math.floor(ag) ? '#fff' : i === Math.floor(ag) ? ['#fff', ag - Math.floor(ag)] : `rgba(255,255,255,${(.07 + .55 * Math.pow(r.chance(i + 1), 1.5)).toFixed(3)})`, .58);
      st.querySelectorAll('.est-chance i').forEach((x, k) => setTimeout(() => x.classList.add('in'), 120 + k * 90));
    });
    st.querySelector('#estUse').onclick = () => {
      S.est = { ...A }; thump();
      if (opt.onUse) { save(); opt.onUse(yrs); closeSheet(); return; }
      S.span = Math.max(40, Math.min(120, yrs)); refresh(); closeSheet(); toast(`Lifespan set to ${S.span}`);
    };
    st.querySelector('#estRe').onclick = () => { tick(); go(1, true); };
  }
  estKeys = e => {
    if (e.key === 'Enter' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || '')) { e.preventDefault(); body.querySelector('[data-next]')?.click() ?? body.querySelector('#estUse')?.click(); }
    else if (/^[1-9]$/.test(e.key) && step > 0 && step < N - 1 && document.activeElement?.tagName !== 'INPUT') body.querySelector(`[data-o="${+e.key - 1}"]`)?.click();
    else if (e.key === 'Backspace' && step > 0 && document.activeElement?.tagName !== 'INPUT') { e.preventDefault(); go(step - 1, true); }
  };
  onClose = () => { S.est = { ...A }; save(); };
  paint();
};
let estKeys = null;

// ================================================= facts
// Every history dot has its own things to say, and says a different one each time you open it.
function eraName(y0) {
  return y0 < -115000 ? 'The Middle Stone Age' : y0 < -26000 ? 'The last ice age' : y0 < -19000 ? 'The coldest part of the ice age' : y0 < -11700 ? 'The ice age ends'
    : y0 < -3200 ? 'The first farmers' : y0 < -1200 ? 'The Bronze Age' : y0 < 500 ? 'The ancient world' : y0 < 1450 ? 'The Middle Ages' : y0 < 1800 ? 'The early modern world' : 'The modern world';
}
SHEETS.fact = i => {
  const last = LIFETIMES - 1; i = Math.max(0, Math.min(last, i));
  const by = birth().getFullYear(), y0 = by - (last - i) * 80, mine = i === last;
  const facts = lifeFacts(i), seen = new Set();
  body.innerHTML = `<div class="fact-k">${mine ? 'Your life' : eraName(y0)}</div>${H2(mine ? `You, since ${by}` : `About ${fmt(new Date().getFullYear() - y0)} years ago`, mine ? 'Things that are true about the life you’re living' : `${yearLabel(y0)} to ${yearLabel(y0 + 80)} · life ${fmt(i + 1)} of ${fmt(LIFETIMES)}`)}
    <div class="fact-card" id="fT"></div><p class="small" id="fN" style="margin:12px 4px 0"></p>
    <div style="height:18px"></div><button class="primary" id="fMore">Tell me another</button>
    <div class="fact-nav"><button class="quiet" id="fOld" ${i === 0 ? 'disabled' : ''}>‹ Older life</button><button class="quiet" id="fNew" ${mine ? 'disabled' : ''}>Newer life ›</button></div>`;
  const show = () => {
    const pool = facts.filter(f => !seen.has(f)); if (!pool.length) seen.clear();
    const f = nextFact(pool.length ? pool : facts); seen.add(f);
    const el = $('fT'); el.classList.remove('in'); void el.offsetWidth; el.textContent = f; el.classList.add('in');
    $('fN').textContent = `${seen.size} of ${facts.length} things this ${mine ? 'part of the grid' : 'life'} can tell you${seen.size === facts.length ? '. You’ve heard them all; they’ll come round again.' : ''}`;
  };
  $('fMore').onclick = () => { tick(); show(); };
  $('fOld').onclick = () => { tick(); SHEETS.fact(i - 1); };
  $('fNew').onclick = () => { tick(); SHEETS.fact(i + 1); };
  factKeys = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fMore')?.click(); } else if (e.key === 'ArrowLeft' && i > 0) SHEETS.fact(i - 1); else if (e.key === 'ArrowRight' && !mine) SHEETS.fact(i + 1); };
  show();
};
let factKeys = null;
document.addEventListener('keydown', e => {
  if (!layer.classList.contains('open') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (openKind === 'lifespan' && estKeys) estKeys(e);
  else if (openKind === 'fact' && factKeys && document.activeElement?.tagName !== 'INPUT') factKeys(e);
});
// a card that shows one fact and swaps it on tap
const factCardHTML = (id, cap) => `<button class="fact-mini" id="${id}"><span class="cap">${cap}</span><span class="tx"></span><span class="more">Tap for another</span></button>`;
function wireFactCard(id, list, lead) {
  const el = $(id); if (!el) return;
  const tx = el.querySelector('.tx'), show = () => { tx.classList.remove('in'); void tx.offsetWidth; tx.textContent = lead ? (lastFact = lead) : nextFact(list()); lead = null; tx.classList.add('in'); };
  el.querySelector('.more').textContent = DESK ? 'Click for another' : 'Tap for another';
  el.onclick = () => { tick(); show(); }; show();
}

// ================================================= where your years go, adjustable
const LEDGER = [
  ['lSleep', 'Sleep', 4, 11, .25, v => `${v} h a night`],
  ['lWork', 'Work', 0, 80, 1, v => v ? `${v} h a week` : 'Not working'],
  ['lRetire', 'Retire at', 40, 85, 1, v => `age ${v}`],
  ['lCommute', 'Commute', 0, 180, 5, v => v ? `${v} min a day` : 'None'],
  ['lChores', 'Eating, chores, getting ready', 0, 8, .25, v => `${v} h a day`],
  ['phoneH', 'Phone', 0, 12, .25, v => `${v} h a day`],
];
function ledgerData() {
  const left = yearsLeft(), a = age(birth()), wy = Math.max(0, Math.min(left, S.lRetire - a)), wk = 48 / 52.1775; // about 4 weeks off a year
  const sl = [['Asleep', left * S.lSleep / 24, '#2c2c2e'], ['Working', wy * S.lWork / 168 * wk, '#48484a'], ['Commuting', wy * S.lCommute / 60 * 5 / 168 * wk, '#5a5a5e'],
    ['Eating and chores', left * S.lChores / 24, '#3a3a3c'], ['On your phone', left * S.phoneH / 24, '#8e8e93']];
  const used = sl.reduce((p, s) => p + s[1], 0); if (used > left) sl.forEach(s => s[1] *= left / used);
  sl.push(['Truly yours', Math.max(0, left - Math.min(left, used)), '#ffffff']);
  return { left, sl, free: sl[5][1] };
}
const ledgerSlidersHTML = () => `<div class="lsl">${LEDGER.map(([k, l, lo, hi, st, f]) => `<label><span>${l}</span><output data-lo="${k}">${f(S[k])}</output></label><input class="range" type="range" data-lk="${k}" min="${lo}" max="${hi}" step="${st}" value="${S[k]}">`).join('')}<button class="quiet" data-lreset style="height:40px;margin-top:6px">Reset to typical</button></div>`;
/** Moves the sliders and repaints in place, so a drag is never interrupted. */
function wireLedger(root, repaint) {
  let sT;
  root.querySelectorAll('[data-lk]').forEach(r => r.oninput = () => {
    const k = r.dataset.lk, def = LEDGER.find(x => x[0] === k); S[k] = +r.value; root.querySelector(`[data-lo="${k}"]`).textContent = def[5](S[k]);
    if (S[k] % (def[4] * 4 || 1) === 0) tick(); repaint(); clearTimeout(sT); sT = setTimeout(save, 300);
  });
  const rs = root.querySelector('[data-lreset]'); if (rs) rs.onclick = () => { tick(); LEDGER.forEach(([k]) => S[k] = DEF[k]); save(); root.querySelectorAll('[data-lk]').forEach(r => { r.value = S[r.dataset.lk]; root.querySelector(`[data-lo="${r.dataset.lk}"]`).textContent = LEDGER.find(x => x[0] === r.dataset.lk)[5](S[r.dataset.lk]); }); repaint(); };
}

// ================================================= lifecycle
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(liveRAF); return; }
  if (S.birth && started) { renderAll(false); setTimeout(rippleNow, 350); setTimeout(checkMoments, 600); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (started) { renderAll(false); $('pager').scrollTo({ left: S.page * $('pager').clientWidth, behavior: 'instant' }); } }, 150); });
setInterval(() => { if (S.birth && started && !document.hidden) { ['life', 'decade', 'year'].forEach(k => { grids[k].update(false); if (S.style !== 'live') renderHead(k); }); } }, 30000);

if (DEMO) addEventListener('message', e => {
  const d = e.data || {}; if (!started || typeof d !== 'object') return;
  if (d.close) closeSheet();
  if (typeof d.zoom === 'number' && d.zoom >= 0 && d.zoom <= 4) setZoom(d.zoom);
  if (typeof d.page === 'number' && DESK && studioOn) studioGo(d.page + 1);
  else if (typeof d.page === 'number') $('pager').scrollTo({ left: Math.max(0, Math.min(4, d.page)) * $('pager').clientWidth, behavior: 'smooth' });
  if (d.style && ['classic', 'hero', 'live'].includes(d.style)) { S.style = d.style; swapHead(); }
  if (typeof d.lived === 'boolean' && d.lived !== S.lived) { S.lived = d.lived; swapHead(); }
  if (d.sheet === 'milestone') openSheet('milestone', Math.floor(age(birth())) + 6);
  if (d.sheet === 'settings') openSheet('settings');
  if (d.ripple) { S.zoom === 1 ? rippleNow() : 0; }
});
if (S.birth) startHome(); else { $('ob').hidden = false; obRender(1); }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
