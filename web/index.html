<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR = () => Math.min(3, devicePixelRatio || 1);
const fmt = n => Math.floor(Math.max(0, n)).toLocaleString('en-US');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// ================================================= haptics
// iOS 18+ Safari gives a light haptic when a switch control toggles; other phones use vibrate.
const hapt = $('hapt');

}
const save = () => { if (DEMO) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

// ================================================= life maths (same rules as the Android app)
const birthdayIn = (b, y) => { const d = new Date(y, b.getMonth(), b.getDate()); return d.getMonth() !== b.getMonth() ? new Date(y, b.getMonth() + 1, 0) : d; };

function age(b, now = new Date()) {

const lastBirthday = (b, t) => birthdayIn(b, b.getFullYear() + wholeYears(b, t));
const isBirthday = (b, t = new Date()) => day0(t) > b && +birthdayIn(b, t.getFullYear()) === +day0(t);

const yearsLeft = () => Math.max(0, S.span - age(birth()));
const daysLeftExact = () => Math.max(0, (new Date(birth().getFullYear() + S.span, birth().getMonth(), birth().getDate()) - new Date()) / 864e5);

const MEASURES = [['year', 'years', 1], ['day', 'days', 365.2425], ['week', 'weeks', 52.1775], ['summer', 'summers', 1], ['weekend', 'weekends', 52.1775], ['full moon', 'full moons', 365.2425 / 29.530589]];
const ZOOMS = ['History', 'Years', 'Months', 'Weeks', 'Days'];
const LIFETIMES = 3750;

function model(kind, now = new Date()) {
  const b = birth(), a = age(b, now), lived = Math.floor(a), by = b.getFullYear();
  if (kind === 'decade') {
    const st = Math.floor(lived / 10) * 10;
    return { kind, total: 10, done: Math.min(10, Math.max(0, a - st)), cols: 5, unit: 'year', context: st === 0 ? 'Your first decade' : `Your ${st}s`, sub: `Ages ${st}–${st + 9}`, label: i => `Age ${st + i} · ${by + st + i}`, year: i => st + i };
  }
  if (kind === 'year') {

    while (m < 11 && addMonths(lb, m + 1) <= day0(now)) m++;

    const f = Math.min(1, Math.max(0, (now - st) / (en - st)));

    return { kind, total: 12, done: Math.min(12, m + f), cols: 6, unit: 'month', context: `Age ${lived}`, sub: `Turning ${lived + 1} on ${nb.getDate()} ${MON[nb.getMonth()]}`, label: i => { const d = addMonths(lb, i); return `${MON[d.getMonth()]} ${d.getFullYear()}`; }, year: null };
  }

    case 2: return { kind, total: S.span * 12, done: Math.min(S.span * 12, a * 12), cols: 36, unit: 'month', sub, label: i => { const d = addMonths(b, i); return `${MON[d.getMonth()]} ${d.getFullYear()} · age ${Math.floor(i / 12)}`; }, year: null };

  }
}

function headline(m) {
  if (m.unit === 'lifetime') { const f = (m.done - (m.total - 1)) * 100; return { v: m.total, noun: 'lives', word: 'of human history', pct: S.lived ? f : 100 - f, one: 'life', many: 'lives' }; }

  else if (m.unit === 'month') ms = ['month', 'months', 12];
  else if (m.unit === 'week') ms = ['week', 'weeks', 52.1775];
  else if (m.unit === 'day') ms = ['day', 'days', 365.2425];
  else ms = MEASURES[((S.unit % MEASURES.length) + MEASURES.length) % MEASURES.length];
  let base, pct;
  if (m.kind === 'life') { const lv = Math.min(S.span, age(birth())); base = S.lived ? lv : Math.max(0, S.span - lv); pct = base / S.span * 100; }
  else { base = S.lived ? m.done : Math.max(0, m.total - m.done); pct = base / m.total * 100; }

const together = p => { const a = new Date().getFullYear() - p.born; const theirs = Math.max(S.span - a, a < 105 ? Math.max(2, (100 - a) / 3) : 1); const yrs = Math.min(yearsLeft(), theirs); return { v: Math.floor(yrs * p.per), yrs, a }; };

      x.fillStyle = 'rgba(142,142,147,.6)'; x.font = `400 ${Math.round(W * .03)}px -apple-system, Inter, sans-serif`; x.fillText(lineOfDay(), W / 2, top + gh + W * .135);
