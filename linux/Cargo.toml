[package]
name = "yrs"
version = "1.0.0"
edition = "2021"
description = "Your life, in dots."
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.31"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
tiny-skia = "0.11"
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
