<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Years">
<meta name="description" content="See the years you have left, in dots.">
<title>Years</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* SF Pro first: built-in on Apple devices, or from ./fonts (see fonts/README.md) */
  @font-face { font-family: "SFP Display"; font-weight: 200; font-display: swap;
    src: local("SF Pro Display Thin"), local("SFProDisplay-Thin"), url("fonts/SF-Pro-Display-Thin.otf") format("opentype"); }
  @font-face { font-family: "SFP Display"; font-weight: 300; font-display: swap;
    src: local("SF Pro Display Light"), local("SFProDisplay-Light"), url("fonts/SF-Pro-Display-Light.otf") format("opentype"); }
  @font-face { font-family: "SFP Display"; font-weight: 400; font-display: swap;
    src: local("SF Pro Display Regular"), local("SFProDisplay-Regular"), url("fonts/SF-Pro-Display-Regular.otf") format("opentype"); }
  @font-face { font-family: "SFP Display"; font-weight: 500; font-display: swap;
    src: local("SF Pro Display Medium"), local("SFProDisplay-Medium"), url("fonts/SF-Pro-Display-Medium.otf") format("opentype"); }
  @font-face { font-family: "SFP Display"; font-weight: 600; font-display: swap;
    src: local("SF Pro Display Semibold"), local("SFProDisplay-Semibold"), url("fonts/SF-Pro-Display-Semibold.otf") format("opentype"); }
  @font-face { font-family: "SFP Display"; font-weight: 700; font-display: swap;
    src: local("SF Pro Display Bold"), local("SFProDisplay-Bold"), url("fonts/SF-Pro-Display-Bold.otf") format("opentype"); }
  @font-face { font-family: "SFP Text"; font-weight: 400; font-display: swap;
    src: local("SF Pro Text Regular"), local("SFProText-Regular"), url("fonts/SF-Pro-Text-Regular.otf") format("opentype"); }
  @font-face { font-family: "SFP Text"; font-weight: 500; font-display: swap;
    src: local("SF Pro Text Medium"), local("SFProText-Medium"), url("fonts/SF-Pro-Text-Medium.otf") format("opentype"); }
  @font-face { font-family: "SFP Text"; font-weight: 600; font-display: swap;
    src: local("SF Pro Text Semibold"), local("SFProText-Semibold"), url("fonts/SF-Pro-Text-Semibold.otf") format("opentype"); }
  @font-face { font-family: "SFP Text"; font-weight: 700; font-display: swap;
    src: local("SF Pro Text Bold"), local("SFProText-Bold"), url("fonts/SF-Pro-Text-Bold.otf") format("opentype"); }
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8e8e93;          /* iOS secondaryLabel */
    --faint: #48484a;
    --empty: #232323;        /* remaining dots, quiet on OLED */
    --surface: #1c1c1e;      /* iOS secondarySystemBackground */
    --surface2: #2c2c2e;
    --separator: #38383a;
    --pad: 24px;
    --spring: cubic-bezier(.2,.9,.25,1);
    --font: "SFP Text", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --font-display: "SFP Display", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "cv11" 1;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  [hidden] { display: none !important; }

  .screen {
    min-height: 100%;
    padding: calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + var(--pad))
             calc(env(safe-area-inset-bottom) + 96px) calc(env(safe-area-inset-left) + var(--pad));
    max-width: 520px; margin: 0 auto;
  }

  /* ---------- Top bar ---------- */
  .bar { display: flex; justify-content: flex-end; height: 32px; margin-bottom: 36px; }
  .more {
    width: 32px; height: 32px; border-radius: 50%; background: var(--surface);
    display: grid; place-items: center; transition: transform .25s var(--spring), background .2s;
  }
  .more:active { transform: scale(.9); background: var(--surface2); }
  .more svg { width: 16px; height: 4px; }

  /* ---------- Header: three styles ---------- */
  #head { transition: opacity .18s ease, transform .3s var(--spring); }
  #head.swap { opacity: 0; transform: translateY(4px); }
  .h-title { font: 600 22px/1.15 var(--font-display); letter-spacing: -0.02em; }
  .h-sub { margin-top: 3px; font-size: 15px; font-weight: 500; color: var(--dim); letter-spacing: -0.01em; }

  .h-hero { display: flex; align-items: baseline; gap: 10px; margin-top: -6px; }
  .h-num { font: 200 104px/0.9 var(--font-display); letter-spacing: -0.045em; }
  .h-num small { font-size: .42em; font-weight: 300; letter-spacing: -0.02em; margin-left: 2px; }
  .h-unit { font: 500 17px var(--font); color: var(--dim); letter-spacing: -0.01em; }

  .h-live { font: 300 44px/1 var(--font-display); letter-spacing: -0.03em; }
  .h-live .frac { color: var(--dim); }

  /* ---------- Grid ---------- */
  .gridwrap { position: relative; margin: 32px -2.08% 0; }
  .style-hero .gridwrap { margin-top: 40px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); touch-action: none; }
  .dot {
    position: relative; aspect-ratio: 1; cursor: pointer;
    opacity: 0; transform: scale(.4);
    animation: in .7s var(--spring) forwards;
    animation-delay: calc(var(--i) * 9ms);
  }
  .dot::before {
    content: ""; position: absolute; inset: 20%; border-radius: 50%;
    background: var(--empty);
    transition: transform .28s var(--spring), background .2s;
  }
  .dot.lived::before { background: var(--fg); }
  /* the year you're in: fills from the bottom by how much of it has passed */
  .dot.now::before {
    background: linear-gradient(to top, var(--fg) var(--fill), #3a3a3c var(--fill));
    animation: breathe 3.2s ease-in-out 1.2s infinite;
  }
  .dot.active::before { transform: scale(1.38); }
  @keyframes in { to { opacity: 1; transform: none; } }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  .tip {
    position: absolute; left: 0; top: 0; pointer-events: none;
    padding: 6px 10px; border-radius: 10px; background: var(--fg); color: #000;
    font-size: 13px; font-weight: 600; white-space: nowrap; letter-spacing: -0.01em;
    transform: translate(-50%, calc(-100% - 6px)) scale(.9); opacity: 0;
    transition: opacity .15s ease, transform .2s var(--spring);
  }
  .tip.show { opacity: 1; transform: translate(-50%, calc(-100% - 6px)); }

  /* ---------- Bottom controls ---------- */
  .controls {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 calc(env(safe-area-inset-right) + var(--pad)) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + var(--pad));
    pointer-events: none;
  }
  .controls > * { pointer-events: auto; }
  .pill {
    height: 36px; padding: 0 12px 0 16px; border-radius: 18px; background: var(--surface);
    display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500;
    transition: transform .25s var(--spring), background .2s;
  }
  .pill svg { width: 8px; height: 12px; opacity: .55; }
  .round {
    width: 36px; height: 36px; border-radius: 50%; background: var(--surface);
    display: grid; place-items: center; font-size: 15px; font-weight: 600;
    transition: transform .25s var(--spring), background .2s, color .2s;
  }
  .pill:active, .round:active { transform: scale(.92); background: var(--surface2); }
  .round.on { background: var(--fg); color: #000; }

  /* ---------- Onboarding ---------- */
  .ask { padding-top: 15vh; }
  .ask h1 { font: 700 34px/1.1 var(--font-display); letter-spacing: -0.025em; }
  .ask p { margin-top: 10px; font-size: 15px; color: var(--dim); }
  .field {
    margin-top: 40px; width: 100%; background: var(--surface); border-radius: 14px; border: 0;
    color: var(--fg); font: 500 20px/1 var(--font); padding: 18px;
    color-scheme: dark; appearance: none; -webkit-appearance: none; min-height: 60px;
  }
  .field:focus { outline: 1px solid var(--faint); }
  .primary {
    margin-top: 16px; width: 100%; height: 54px; border-radius: 27px;
    background: var(--fg); color: #000; font-size: 17px; font-weight: 600;
    transition: opacity .2s ease, transform .2s var(--spring);
  }
  .primary:active { transform: scale(.97); }
  .primary:disabled { opacity: .25; }

  /* ---------- Settings sheet ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 520px;
    background: var(--surface); border-radius: 22px 22px 0 0;
    padding: 10px var(--pad) calc(env(safe-area-inset-bottom) + 24px);
    transform: translateY(105%); transition: transform .42s var(--spring);
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--faint); margin: 0 auto 18px; }
  .sheet h2 { font: 600 20px var(--font-display); letter-spacing: -0.015em; margin-bottom: 18px; }
  .label { margin: 22px 4px 8px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .02em; }
  .group { background: var(--surface2); border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; font-size: 17px; width: 100%; text-align: left; }
  .row + .row { border-top: .5px solid var(--separator); }
  .row input[type=date] { background: none; border: 0; color: var(--dim); font: 400 17px var(--font); color-scheme: dark; text-align: right; }
  .row .chev { color: var(--faint); font-size: 20px; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 32px; height: 32px; border-radius: 50%; background: #3a3a3c; font-size: 20px; line-height: 1; display: grid; place-items: center; }
  .stepper button:active { background: var(--faint); }
  .stepper output { min-width: 28px; text-align: center; color: var(--dim); font-size: 17px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface2); border-radius: 10px; padding: 2px; position: relative; }
  .seg button { position: relative; z-index: 1; height: 32px; font-size: 14px; font-weight: 500; color: var(--dim); transition: color .2s; }
  .seg button.sel { color: var(--fg); }
  .seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 3); border-radius: 8px; background: #5a5a5e; transition: transform .35s var(--spring); }
  .note { margin: 10px 4px 0; font-size: 13px; color: var(--dim); line-height: 1.4; }
  .sheet .primary { margin-top: 22px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px);
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    background: var(--surface2); padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 500;
    transition: opacity .2s ease, transform .3s var(--spring);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .dot, .dot.now::before { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<!-- Onboarding -->
<main class="screen ask" id="ask" hidden>
  <h1>When were<br>you born?</h1>
  <p>Stays on this device. Nothing is sent anywhere.</p>
  <input class="field" id="askDate" type="date" aria-label="Birthday">
  <button class="primary" id="askGo" disabled>Continue</button>
</main>

<!-- Main -->
<main class="screen" id="home" hidden>
  <div class="bar">
    <button class="more" id="moreBtn" aria-label="Settings">
      <svg viewBox="0 0 16 4" fill="#fff"><circle cx="2" cy="2" r="1.6"/><circle cx="8" cy="2" r="1.6"/><circle cx="14" cy="2" r="1.6"/></svg>
    </button>
  </div>
  <div id="head" aria-live="polite"></div>
  <div class="gridwrap">
    <div class="grid" id="grid" role="img"></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="controls">
    <button class="pill" id="modeBtn" aria-label="Switch between years left and years lived">
      <span id="modeLabel">Left</span>
      <svg viewBox="0 0 8 12" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4 4 1.5 6.5 4M1.5 8 4 10.5 6.5 8"/></svg>
    </button>
    <button class="round" id="pctBtn" aria-label="Show percentage" aria-pressed="false">%</button>
  </div>
</main>

<!-- Settings -->
<div id="settings">
  <div class="scrim" id="scrim"></div>
  <section class="sheet" role="dialog" aria-label="Settings">
    <div class="grabber"></div>
    <h2>Settings</h2>
    <div class="group">
      <label class="row">Birthday <input type="date" id="setDate"></label>
      <div class="row">Lifespan
        <div class="stepper">
          <button id="minus" aria-label="Decrease">−</button>
          <output id="span">80</output>
          <button id="plus" aria-label="Increase">+</button>
        </div>
      </div>
    </div>
    <div class="label">Number style</div>
    <div class="seg" id="seg">
      <div class="thumb" id="thumb"></div>
      <button data-style="classic">Classic</button>
      <button data-style="hero">Large</button>
      <button data-style="live">Live</button>
    </div>
    <div class="group" style="margin-top:22px">
      <button class="row" id="wallBtn">Save as wallpaper <span class="chev">›</span></button>
    </div>
    <p class="note">Each dot is one year. The year you're in fills up as it passes. Drag across the dots to travel through your life.</p>
    <button class="primary" id="done">Done</button>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = 'years.v1';
  const YEAR_MS = 365.2425 * 864e5;
  const $ = id => document.getElementById(id);
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
  const state = Object.assign({ birth: null, span: 80, mode: 'left', pct: false, style: 'classic' }, load());
  const buzz = (ms = 6) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

  const today = () => new Date().toISOString().slice(0, 10);
  const validBirth = v => v && v <= today() && v >= '1900-01-01';
  const birthTime = () => { const [y, m, d] = state.birth.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
  const ageNow = () => (Date.now() - birthTime()) / YEAR_MS;
  const yrs = n => `${n} ${n === 1 ? 'year' : 'years'}`;

  /* ---------- Header ---------- */
  function headerHTML(age) {
    const span = state.span, left = Math.max(0, span - age), lived = Math.floor(age);
    const isLeft = state.mode === 'left';
    const pctLived = Math.min(100, (age / span) * 100);
    const pct = isLeft ? 100 - pctLived : pctLived;
    const sub = `Age ${lived} · ${span} year life`;
    const word = isLeft ? 'left' : 'lived';

    if (state.style === 'hero') {
      const n = state.pct ? `${Math.floor(pct)}<small>%</small>` : (isLeft ? Math.floor(left) : lived);
      const unit = state.pct ? word : `${(isLeft ? Math.floor(left) : lived) === 1 ? 'year' : 'years'} ${word}`;
      return `<div class="h-hero"><div class="h-num">${n}</div><div class="h-unit">${unit}</div></div><div class="h-sub">${sub}</div>`;
    }
    if (state.style === 'live') {
      const v = state.pct ? pct.toFixed(7) : (isLeft ? left : age).toFixed(8);
      const [i, f] = v.split('.');
      return `<div class="h-live"><span id="liveI">${i}</span><span class="frac">.<span id="liveF">${f}</span>${state.pct ? '%' : ''}</span></div>
              <div class="h-sub">${state.pct ? `of life ${word}` : `years ${word}`} · ${sub}</div>`;
    }
    const title = state.pct ? `${Math.floor(pct)}% ${word}`
      : isLeft ? (left <= 0 ? 'Every year is a gift' : Math.floor(left) === 0 ? 'Less than a year left' : `${yrs(Math.floor(left))} left`)
      : `${yrs(lived)} lived`;
    return `<div class="h-title">${title}</div><div class="h-sub">${sub}</div>`;
  }

  // Live counter: updates only the digits, every frame, no layout thrash
  let raf;
  function liveLoop() {
    cancelAnimationFrame(raf);
    if (state.style !== 'live' || $('home').hidden) return;
    const tickFn = () => {
      const age = ageNow(), isLeft = state.mode === 'left';
      const v = state.pct ? (isLeft ? 100 - age / state.span * 100 : age / state.span * 100).toFixed(7)
                          : (isLeft ? Math.max(0, state.span - age) : age).toFixed(8);
      const [i, f] = v.split('.');
      const I = $('liveI'), F = $('liveF');
      if (I) { if (I.textContent !== i) I.textContent = i; F.textContent = f; }
      raf = requestAnimationFrame(tickFn);
    };
    raf = requestAnimationFrame(tickFn);
  }

  /* ---------- Grid ---------- */
  let gridKey = '';
  function render(forceGrid) {
    const age = ageNow(), span = state.span, lived = Math.floor(age), left = span - age;
    document.body.className = 'style-' + state.style;
    $('head').innerHTML = headerHTML(age);
    $('modeLabel').textContent = state.mode === 'left' ? 'Left' : 'Lived';
    $('pctBtn').classList.toggle('on', state.pct);
    $('pctBtn').setAttribute('aria-pressed', state.pct);
    liveLoop();

    const key = `${lived}|${span}|${state.birth}`;
    const grid = $('grid');
    if (key !== gridKey || forceGrid) {
      gridKey = key;
      grid.setAttribute('aria-label', `${lived} of ${span} years lived`);
      const frag = document.createDocumentFragment();
      for (let i = 0; i < span; i++) {
        const el = document.createElement('div');
        el.className = 'dot' + (i < lived ? ' lived' : i === lived && left > 0 ? ' now' : '');
        el.style.setProperty('--i', i);
        el.dataset.i = i;
        frag.appendChild(el);
      }
      grid.replaceChildren(frag);
    }
    const now = grid.querySelector('.dot.now');
    if (now) now.style.setProperty('--fill', `${((age - lived) * 100).toFixed(1)}%`);
  }

  /* ---------- Scrub through your life ---------- */
  const tip = $('tip');
  let activeDot = null, scrubbing = false, tipTimer;
  function pointAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const dot = el && el.closest && el.closest('.dot');
    if (!dot || dot === activeDot) return;
    activeDot && activeDot.classList.remove('active');
    activeDot = dot; dot.classList.add('active'); buzz(4);
    const i = +dot.dataset.i, year = +state.birth.slice(0, 4) + i;
    const lived = Math.floor(ageNow());
    const tag = i < lived ? '' : i === lived ? ' · now' : '';
    tip.textContent = `Age ${i} · ${year}${tag}`;
    const wrap = $('grid').getBoundingClientRect(), r = dot.getBoundingClientRect();
    const half = tip.offsetWidth / 2 + 4;
    const cx = Math.min(Math.max(r.left + r.width / 2 - wrap.left, half), wrap.width - half);
    tip.style.left = cx + 'px'; tip.style.top = (r.top - wrap.top + r.height * 0.2) + 'px';
    tip.classList.add('show');
  }
  function endScrub() {
    scrubbing = false;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => { tip.classList.remove('show'); activeDot && activeDot.classList.remove('active'); activeDot = null; }, 1200);
  }
  const g = $('grid');
  g.addEventListener('pointerdown', e => { scrubbing = true; clearTimeout(tipTimer); activeDot = null; g.setPointerCapture(e.pointerId); pointAt(e.clientX, e.clientY); });
  g.addEventListener('pointermove', e => { if (scrubbing) pointAt(e.clientX, e.clientY); });
  g.addEventListener('pointerup', endScrub);
  g.addEventListener('pointercancel', endScrub);

  /* ---------- Header toggles ---------- */
  const swap = fn => {
    buzz();
    $('head').classList.add('swap');
    setTimeout(() => { fn(); save(); render(); $('head').classList.remove('swap'); }, 170);
  };
  $('modeBtn').addEventListener('click', () => swap(() => { state.mode = state.mode === 'left' ? 'lived' : 'left'; }));
  $('pctBtn').addEventListener('click', () => swap(() => { state.pct = !state.pct; }));

  /* ---------- Screens ---------- */
  function show() {
    const ready = validBirth(state.birth);
    $('ask').hidden = ready; $('home').hidden = !ready;
    if (ready) render(true);
  }
  const askDate = $('askDate');
  askDate.max = today();
  askDate.addEventListener('input', () => { $('askGo').disabled = !validBirth(askDate.value); });
  $('askGo').addEventListener('click', () => { if (validBirth(askDate.value)) { state.birth = askDate.value; save(); buzz(10); show(); } });

  /* ---------- Settings ---------- */
  const settings = $('settings'), setDate = $('setDate');
  setDate.max = today();
  function syncSeg() {
    const btns = [...$('seg').querySelectorAll('button')];
    const idx = btns.findIndex(b => b.dataset.style === state.style);
    btns.forEach((b, k) => b.classList.toggle('sel', k === idx));
    $('thumb').style.transform = `translateX(${idx * 100}%)`;
  }
  $('moreBtn').addEventListener('click', () => { buzz(); setDate.value = state.birth; $('span').textContent = state.span; syncSeg(); settings.classList.add('open'); });
  const close = () => settings.classList.remove('open');
  $('scrim').addEventListener('click', close);
  $('done').addEventListener('click', close);
  setDate.addEventListener('change', () => { if (validBirth(setDate.value)) { state.birth = setDate.value; save(); render(true); } });
  const step = d => { state.span = Math.min(120, Math.max(40, state.span + d)); $('span').textContent = state.span; buzz(4); save(); render(true); };
  $('minus').addEventListener('click', () => step(-1));
  $('plus').addEventListener('click', () => step(1));
  $('seg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.style = b.dataset.style; buzz(); save(); syncSeg(); render();
  });

  /* ---------- Wallpaper export ---------- */
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
  $('wallBtn').addEventListener('click', async () => {
    buzz();
    const dpr = window.devicePixelRatio || 2;
    const W = Math.round(screen.width * dpr), H = Math.round(screen.height * dpr);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
    const age = ageNow(), lived = Math.floor(age), span = state.span, cols = 10, rows = Math.ceil(span / cols);
    const gw = W * 0.62, cell = gw / cols, r = cell * 0.3;
    const gh = rows * cell, x0 = (W - gw) / 2, y0 = H * 0.56 - gh / 2;
    for (let i = 0; i < span; i++) {
      const cx = x0 + (i % cols + .5) * cell, cy = y0 + (Math.floor(i / cols) + .5) * cell;
      x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2);
      if (i === lived && age < span) {
        x.fillStyle = '#3a3a3c'; x.fill();
        x.save(); x.clip(); x.fillStyle = '#fff';
        const f = age - lived; x.fillRect(cx - r, cy + r - 2 * r * f, 2 * r, 2 * r * f); x.restore();
      } else { x.fillStyle = i < lived ? '#fff' : '#232323'; x.fill(); }
    }
    const left = Math.max(0, Math.floor(span - age));
    x.fillStyle = '#8e8e93'; x.textAlign = 'center';
    x.font = `500 ${Math.round(15 * dpr)}px ${getComputedStyle(document.body).fontFamily}`;
    x.fillText(`${yrs(left)} left`, W / 2, y0 + gh + 36 * dpr);
    const blob = await new Promise(res => c.toBlob(res, 'image/png'));
    const file = new File([blob], 'years-wallpaper.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Wallpaper saved to Downloads');
  });

  /* ---------- Stay current ---------- */
  document.addEventListener('visibilitychange', () => { if (!document.hidden && validBirth(state.birth)) render(); else cancelAnimationFrame(raf); });
  setInterval(() => { if (validBirth(state.birth) && !document.hidden) render(); }, 60_000);

  show();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
